<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Cyan to Violet Neon Gradient -->
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Subtle Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Canvas Background -->
  <rect width="64" height="64" rx="14" fill="#06070B" />
  
  <!-- Outer Cyber Border -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="url(#cyber-grad)" stroke-width="2.5" opacity="0.6" />

  <!-- Sci-Fi Camera Reel & Play Icon Group -->
  <g filter="url(#glow)">
    <!-- Aperture / Reel Outer Ring -->
    <circle cx="32" cy="32" r="18" fill="none" stroke="url(#cyber-grad)" stroke-width="3" stroke-dasharray="24 4" />
    
    <!-- Central Play Symbol -->
    <polygon points="28,22 42,32 28,42" fill="#00F0FF" />
    
    <!-- Tech Accent Dots -->
    <circle cx="16" cy="16" r="2" fill="#00F0FF" />
    <circle cx="48" cy="48" r="2" fill="#8B5CF6" />
  </g>
</svg>
